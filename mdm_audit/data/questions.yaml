- applies_to: both
  finding_id: intune-remote-wipe-disabled
  theme: Data Protection
  commentary_group: Device Lifecycle and Compliance
  finding_title: Remote Wipe Not Enabled
  section: device_actions
  remediation_id: remote_wipe

  expected_answer: compliant

  question: Is remote wipe functionality available for managed devices?

  description: >
    Remote wipe capability was not configured or available, increasing
    the risk of corporate data remaining accessible on lost, stolen,
    or compromised devices.

  commentary: >
    Remote wipe functionality was not available or had not been configured
    for managed devices. This capability is commonly relied upon to remove
    corporate information from devices that are lost, stolen, compromised,
    or retired. Without remote wipe functionality, the organisation may
    have limited options for protecting information stored on devices that
    are no longer under its direct control.

  solution: >
    Ensure remote wipe functionality is available for managed devices
    and that documented procedures exist for its use when devices are
    lost, stolen, or retired.

  positive: >
    Remote wipe functionality was available and could be executed for
    managed devices.

  expected_value: >
    Remote wipe functionality is enabled and operational

  hints:
    intune: Devices > Android / Apple mobile > Select a device > Overview > 
      Remote Actions > Wipe (factory reset)