- applies_to: both
  finding_id: intune-unrestricted-data-sharing
  theme: Data Protection
  commentary_group: Data Protection
  finding_title: Unrestricted Managed Application Data Sharing
  section: app_protection
  remediation_id: managed_data_sharing

  expected_answer: compliant

  question: Is managed Open-In/sharing (iOS) or policy managed apps (Android) 
    configured to prevent corporate data from being transferred to personal 
    applications?

  description: >
    Corporate data could be transferred from managed applications to
    personal applications, increasing the risk of data leakage and
    unauthorised disclosure of sensitive information.

  commentary: >
    Controls designed to restrict the transfer of corporate information
    between managed and unmanaged applications were not configured.
    Consequently, users may be able to move information outside approved
    management boundaries and into personal applications or services.
    This increases the likelihood of information leakage and may reduce
    organisational control over sensitive data.

  solution: >
    Implement Managed Open-In restrictions and data-sharing controls
    to ensure corporate data can only be opened within approved
    managed applications.

  positive: >
    Managed Open-In restrictions were configured to prevent corporate
    data from being transferred to personal applications.

  expected_value: >
    Anything else than All Apps

  hints:
    intune: Apps > Manage Apps > Protection > Select target policy > Properties 
      > Data Protection > Send org data to other apps

